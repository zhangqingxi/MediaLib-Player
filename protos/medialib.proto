syntax = "proto3";

package medialib.v1;

option go_package = "medialib/api/proto/v1;medialibv1";

// ==========================================
// 1. 设备与用户鉴权服务 (AuthService)
// ==========================================
service AuthService {
  // 播放器账号登录：返回 access_token 与绑定的目录可见范围 (Scope)
  rpc LoginPlayer(LoginPlayerRequest) returns (LoginPlayerResponse);

  // 播放器设备快速注册/扫码绑定
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);

  // 校验与刷新 Token
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

// ==========================================
// 2. 媒体服务 (MediaService) - 供播放器客户端渲染海报墙、查胶囊、换播放直链
// ==========================================
service MediaService {
  // 获取媒体库条目列表（海报墙，支持合集过滤与搜索，自动按 Scope 过滤）
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc GetPosterWall(ListItemsRequest) returns (ListItemsResponse); // 别名兼容

  // 获取单个影片详情（含完整 BDINFO 胶囊与多音轨/字幕信息）
  rpc GetItem(GetItemRequest) returns (MediaItem);

  // 播放换链：传入条目 ID 或 file_key，服务端在播放瞬间换取 115 直链或流媒体地址（抗流控核心）
  rpc GetStreamURL(GetStreamURLRequest) returns (GetStreamURLResponse);
  rpc GetPlaybackUrl(GetStreamURLRequest) returns (GetStreamURLResponse); // 别名兼容

  // 获取系列合集列表（如 X战警系列、漫威宇宙系列）
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);

  // 人审回路：人工纠正匹配 TMDB ID
  rpc RematchItem(RematchItemRequest) returns (RematchItemResponse);
}

// ==========================================
// 3. 播放器同步服务 (PlaybackService) - 供独立播放器/MPV内核跨设备续播与冲突仲裁
// ==========================================
service PlaybackService {
  // 上报播放进度打点（支持多设备时间戳仲裁与单向递增保护）
  rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse);
  rpc ReportPlaybackProgress(ReportProgressRequest) returns (ReportProgressResponse); // 别名兼容

  // 查询指定影片/分集的续播断点
  rpc GetProgress(GetProgressRequest) returns (GetProgressResponse);

  // 获取最近播放历史（泳道与继续观看）
  rpc ListRecentPlaybacks(ListRecentPlaybacksRequest) returns (ListRecentPlaybacksResponse);

  // 双向流式控制与会话同步（支持多端协同与远程遥控）
  rpc SyncSession(stream PlaybackHeartbeat) returns (stream PlaybackCommand);
}

// ==========================================
// 4. 任务引擎服务 (TaskService) - 支持 gRPC 流式进度监听
// ==========================================
service TaskService {
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc WatchTask(WatchTaskRequest) returns (stream TaskProgressEvent);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}

// ==========================================
// 5. 挂载管理服务 (MountService)
// ==========================================
service MountService {
  rpc ListMounts(ListMountsRequest) returns (ListMountsResponse);
  rpc AddMount(AddMountRequest) returns (AddMountResponse);
  rpc RemoveMount(RemoveMountRequest) returns (RemoveMountResponse);
}

// ==========================================
// 实体与消息定义
// ==========================================

message LoginPlayerRequest {
  string username = 1;
  string password = 2;
  string device_name = 3;       // 播放器设备名（如 "客厅索尼电视", "PC-Office"）
  string device_model = 4;      // 硬件型号（如 "Sony-A95L", "Windows-RTX4080"）
  string platform = 5;          // "android_tv" / "android_phone" / "windows" / "macos"
}

message LoginPlayerResponse {
  bool success = 1;
  string access_token = 2;      // 访问 Token (后续放入 Metadata: authorization: Bearer <token>)
  int64 expire_at = 3;          // 过期时间戳 (Unix)
  PlayerUser user = 4;          // 播放器用户信息与 Scope
  string error_message = 5;
}

message RegisterDeviceRequest {
  string device_code = 1;       // 播放器生成的 6 位数字绑定码
  string device_name = 2;
  string platform = 3;
}

message RegisterDeviceResponse {
  bool bound = 1;
  string access_token = 2;
  PlayerUser user = 3;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  PlayerUser user = 2;
}

message PlayerUser {
  int64 id = 1;
  string username = 2;
  string display_name = 3;
  string role = 4;              // "admin" / "player_user" / "kids"
  repeated string allowed_scopes = 5;    // 可见目录标签列表（如 ["动画", "精选4K"]）
  repeated int64 allowed_mount_ids = 6;  // 可见存储挂载 ID 列表（为空则全量可见）
}

message MediaItem {
  int64 id = 1;
  string title = 2;
  string original_title = 3;
  int32 year = 4;
  int64 tmdb_id = 5;
  string poster_url = 6;
  string backdrop_url = 7;
  string overview = 8;
  double rating = 9;
  int32 runtime = 10;
  string collection = 11;
  repeated string genres = 12;
  string library_path = 13;
  string source_path = 14;
  bool doubt = 15;
  bool matched = 16;
  string disc_type = 17;
  string resolution = 18;
  string edition = 19;
  BDInfoCapsule bdinfo = 20;
}

message BDInfoCapsule {
  string source_type = 1;
  string disc_title = 2;
  string disc_label = 3;
  VideoTrack video = 4;
  repeated AudioTrack audio = 5;
  repeated SubtitleTrack subtitles = 6;
}

message VideoTrack {
  string codec = 1;
  int32 width = 2;
  int32 height = 3;
  string resolution_label = 4;
  string hdr_type = 5;
  int32 bit_depth = 6;
  string bit_rate = 7;
  string duration = 8;
}

message AudioTrack {
  string codec = 1;
  int32 channels = 2;
  string channel_layout = 3;
  string bit_rate = 4;
  int32 bit_depth = 5;
  int32 sampling_rate = 6;
  string language = 7;
  string title = 8;
  bool is_atmos = 9;
}

message SubtitleTrack {
  string language = 1;
  string format = 2;
  string title = 3;
  bool is_forced = 4;
}

message ReportProgressRequest {
  int64 media_id = 1;
  int64 episode_id = 2;
  int64 strm_id = 3;
  int32 position_sec = 4;
  int32 duration_sec = 5;
  string device_name = 6;
  string client_session_id = 7;
  bool is_paused = 8;
  bool is_finished = 9;
  int64 timestamp_ms = 10;
}

message ReportProgressResponse {
  bool accepted = 1;
  int32 server_position_sec = 2;
  bool conflict_resolved = 3;
}

message GetProgressRequest {
  int64 media_id = 1;
  int64 episode_id = 2;
}

message GetProgressResponse {
  bool has_record = 1;
  int32 position_sec = 2;
  int32 duration_sec = 3;
  double progress = 4;
  bool completed = 5;
  string last_device_name = 6;
  int64 updated_at_unix = 7;
}

message ListRecentPlaybacksRequest {
  int32 limit = 1;
}

message PlaybackRecordItem {
  int64 id = 1;
  int64 media_id = 2;
  int64 episode_id = 3;
  string title = 4;
  string poster = 5;
  string backdrop = 6;
  string episode_title = 7;
  int32 season_number = 8;
  int32 episode_number = 9;
  int32 position_sec = 10;
  int32 duration_sec = 11;
  double progress = 12;
  bool completed = 13;
  string device_name = 14;
  int64 updated_at_unix = 15;
}

message ListRecentPlaybacksResponse {
  repeated PlaybackRecordItem items = 1;
}

message PlaybackHeartbeat {
  string session_id = 1;
  string device_name = 2;
  int64 media_id = 3;
  int64 episode_id = 4;
  int32 current_position_sec = 5;
  int32 playback_state = 6;
}

message PlaybackCommand {
  enum CommandType {
    NOOP = 0;
    PAUSE = 1;
    RESUME = 2;
    SEEK = 3;
    SYNC_POSITION = 4;
  }
  CommandType type = 1;
  int32 seek_target_sec = 2;
  string operator_device = 3;
}

message GetStreamURLRequest {
  int64 item_id = 1;
  string file_key = 2;
}

message GetStreamURLResponse {
  string play_url = 1;
  bool is_direct = 2;
  int64 expire_at = 3;
  map<string, string> headers = 4;
}

message ListItemsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string collection = 3;
  string keyword = 4;
  bool only_doubt = 5;
  string kind = 6;
  string disc_type = 7;
  string resolution = 8;
  string edition = 9;
  string tag = 10;
}

message ListItemsResponse {
  repeated MediaItem items = 1;
  int64 total = 2;
  int32 page = 3;
}

message GetItemRequest {
  int64 id = 1;
}

message ListCollectionsRequest {}

message CollectionSummary {
  int64 tmdb_id = 1;
  string name = 2;
  string overview = 3;
  string poster_url = 4;
  string backdrop_url = 5;
  int32 movie_count = 6;
}

message ListCollectionsResponse {
  repeated CollectionSummary collections = 1;
}

message RematchItemRequest {
  int64 item_id = 1;
  int64 target_tmdb_id = 2;
}

message RematchItemResponse {
  bool success = 1;
  MediaItem item = 2;
}

message SubmitTaskRequest {
  string type = 1;
  string payload_json = 2;
  int32 priority = 3;
}

message SubmitTaskResponse {
  int64 task_id = 1;
}

message ListTasksRequest {
  string status = 1;
}

message TaskInfo {
  int64 id = 1;
  string type = 2;
  string status = 3;
  int32 priority = 4;
  string payload = 5;
  int32 progress = 6;
  int64 speed = 7;
  int64 eta = 8;
  string error = 9;
  string created_at = 10;
  string started_at = 11;
  string finished_at = 12;
}

message ListTasksResponse {
  repeated TaskInfo tasks = 1;
}

message WatchTaskRequest {
  int64 task_id = 1;
}

message TaskProgressEvent {
  int64 task_id = 1;
  string status = 2;
  int32 progress = 3;
  int64 speed = 4;
  int64 eta = 5;
  string error = 6;
}

message CancelTaskRequest {
  int64 task_id = 1;
}

message CancelTaskResponse {
  bool success = 1;
}

message ListMountsRequest {}

message MountEntry {
  string name = 1;
  string type = 2;
  string root_path = 3;
  bool read_only = 4;
}

message ListMountsResponse {
  repeated MountEntry mounts = 1;
}

message AddMountRequest {
  string name = 1;
  string type = 2;
  string root_path = 3;
  bool read_only = 4;
  map<string, string> options = 5;
}

message AddMountResponse {
  bool success = 1;
}

message RemoveMountRequest {
  string name = 1;
}

message RemoveMountResponse {
  bool success = 1;
}
